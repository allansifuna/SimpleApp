name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "eu-west-2"
  TF_DIR: terraform/envs/dev

jobs:
  fmt-validate:
    name: fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform
      - name: terraform validate
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/ "$TF_DIR"; do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  plan:
    name: plan (dev)
    if: github.event_name == 'pull_request'
    needs: fmt-validate
    runs-on: ubuntu-latest
    environment: dev-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Assume the read-only plan role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false
      - name: terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -input=false -var-file=dev.tfvars -no-color -out=tfplan.bin | tee plan_output.txt
        continue-on-error: true
      - name: Comment plan on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${{ env.TF_DIR }}/plan_output.txt`;
            let body = fs.readFileSync(path, 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n... (truncated)';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform plan — dev\n\`\`\`\n${body}\n\`\`\``,
            });
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: apply (dev)
    if: github.event_name == 'push'
    needs: fmt-validate
    runs-on: ubuntu-latest
    environment: dev-apply
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Assume the apply role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false
      - name: terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve -var-file=dev.tfvars
